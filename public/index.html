<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI電話応答 検証コンソール</title>
    <style>
      :root {
        --bg: #f7f7f5;
        --fg: #1c1c1a;
        --muted: #6b6b66;
        --line: #dedcd6;
        --accent: #2f6f4f;
        --warn: #a2431f;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px;
        background: var(--bg);
        color: var(--fg);
        font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
        line-height: 1.7;
      }
      .wrap { max-width: 940px; margin: 0 auto; }
      h1 { font-size: 20px; margin: 0 0 4px; }
      .lead { color: var(--muted); font-size: 13px; margin: 0 0 20px; }
      .panel {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 16px;
      }
      .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
      button {
        font: inherit;
        padding: 9px 20px;
        border-radius: 6px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
      button.ghost { background: #fff; color: var(--fg); border-color: var(--line); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      input {
        font: inherit;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 6px;
        width: 190px;
      }
      label { font-size: 13px; color: var(--muted); }
      .state {
        margin-left: auto;
        font-size: 13px;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .state b { color: var(--fg); font-weight: 600; }
      #log { height: 340px; overflow-y: auto; font-size: 14px; }
      .turn { padding: 7px 0; border-bottom: 1px solid #f0efea; }
      .turn:last-child { border-bottom: 0; }
      .who { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
      .caller .body { color: #21486b; }
      .agent .body { color: var(--accent); }
      .sys .body { color: var(--warn); font-size: 13px; }
      .partial { color: var(--muted); font-style: italic; }
      .metric { font-size: 11px; color: var(--muted); margin-left: 8px; }
      table { border-collapse: collapse; width: 100%; font-size: 13px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #f0efea; }
      th { color: var(--muted); font-weight: 600; font-size: 12px; }
      td.num { text-align: right; font-variant-numeric: tabular-nums; }
      .over { color: var(--warn); font-weight: 600; }
      .hint { font-size: 12px; color: var(--muted); margin-top: 10px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>AI電話応答 検証コンソール</h1>
      <p class="lead" style="margin-bottom: 4px">
        <a href="/admin.html" style="color: var(--accent)">教室設定(在籍生徒・案内事項・空き状況)→</a>
      </p>
      <p class="lead">
        携帯をスピーカーフォンにして、このPCのマイク前に置いてください。保護者役として話しかけると、
        AIが応答します。応答の遅延は要件書 §1.3 の目標「1.5秒以内」で判定します。
      </p>

      <div class="panel">
        <div class="row">
          <label>発信者番号 <input id="caller" placeholder="09012345678" /></label>
          <button id="start">通話を開始</button>
          <button id="hangup" class="ghost" disabled>切る</button>
          <span class="state">段階 <b id="stateLabel">待機中</b></span>
        </div>
        <p class="hint">
          発信者番号を入れておくと、聞き取りに失敗しても折り返せるか(§7.3)を確認できます。
        </p>
      </div>

      <div class="panel" id="log"></div>

      <div class="panel">
        <div class="row" style="margin-bottom: 8px">
          <strong style="font-size: 14px">応答の遅延</strong>
          <span class="state">
            平均 <b id="avg">—</b> / 1.5秒以内 <b id="rate">—</b>
          </span>
        </div>
        <table>
          <thead>
            <tr>
              <th>保護者の発話</th>
              <th class="num">発話終了から(ms)</th>
              <th class="num">うち音声合成(ms)</th>
            </tr>
          </thead>
          <tbody id="metrics"></tbody>
        </table>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const log = $("log");

      let ws = null;
      let audioCtx = null;
      let micStream = null;
      let recorder = null;
      let partialEl = null;
      let lastHeard = "";
      const latencies = [];

      function line(cls, who, text, metric) {
        const el = document.createElement("div");
        el.className = `turn ${cls}`;
        el.innerHTML =
          `<div class="who">${who}</div>` +
          `<div class="body"></div>`;
        el.querySelector(".body").textContent = text;
        if (metric) {
          const m = document.createElement("span");
          m.className = "metric";
          m.textContent = metric;
          el.querySelector(".body").appendChild(m);
        }
        log.appendChild(el);
        log.scrollTop = log.scrollHeight;
        return el;
      }

      function addMetric(utterance, latencyMs, ttsMs) {
        latencies.push(latencyMs);
        const tr = document.createElement("tr");
        // §1.3 の目標を超えた行はその場で分かるようにする
        const cls = latencyMs > 1500 ? "num over" : "num";
        tr.innerHTML = `<td></td><td class="${cls}">${latencyMs}</td><td class="num">${ttsMs}</td>`;
        tr.firstChild.textContent = utterance;
        $("metrics").appendChild(tr);

        const avg = Math.round(latencies.reduce((a, b) => a + b, 0) / latencies.length);
        const within = latencies.filter((v) => v <= 1500).length;
        $("avg").textContent = `${avg}ms`;
        $("rate").textContent = `${within}/${latencies.length}`;
      }

      /** 再生中の音声。被せ(バージイン)で途中停止できるように持っておく */
      let current = null;

      function stopPlayback() {
        if (!current) return;
        current.el.pause();
        current.resolve();
        current = null;
      }

      async function playAudio(base64) {
        if (!base64) return;
        stopPlayback(); // 前の再生が残っていたら止める
        const bytes = Uint8Array.from(atob(base64), (c) => c.charCodeAt(0));
        const url = URL.createObjectURL(new Blob([bytes], { type: "audio/mpeg" }));
        const el = new Audio(url);
        await new Promise((resolve) => {
          current = { el, resolve };
          el.onended = () => { current = null; resolve(); };
          el.onerror = () => { current = null; resolve(); };
          el.play().catch(() => { current = null; resolve(); });
        });
        URL.revokeObjectURL(url);
      }

      async function start() {
        $("start").disabled = true;
        micStream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });

        // 通話全体を録音しておく(§4.2 録音ファイル / §8.1 冒頭で告知済み)
        recorder = new MediaRecorder(micStream);
        const chunks = [];
        recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
        recorder.onstop = () =>
          fetch("/recording", { method: "POST", body: new Blob(chunks) }).catch(() => {});
        recorder.start();

        audioCtx = new AudioContext({ sampleRate: 16000 });
        await audioCtx.audioWorklet.addModule("/mic-worklet.js");
        const node = new AudioWorkletNode(audioCtx, "mic-processor");
        audioCtx.createMediaStreamSource(micStream).connect(node);

        ws = new WebSocket(`ws://${location.host}`);
        ws.binaryType = "arraybuffer";

        node.port.onmessage = (e) => {
          if (ws?.readyState === WebSocket.OPEN) ws.send(e.data);
        };

        ws.onopen = () => {
          ws.send(JSON.stringify({ type: "start", callerNumber: $("caller").value.trim() }));
          $("hangup").disabled = false;
          line("sys", "システム", "通話を開始しました。");
        };

        ws.onmessage = async (event) => {
          const msg = JSON.parse(event.data);

          if (msg.type === "partial") {
            if (!partialEl) partialEl = line("caller partial", "保護者(認識中)", "");
            partialEl.querySelector(".body").textContent = msg.text;
            return;
          }
          if (msg.type === "heard") {
            partialEl?.remove();
            partialEl = null;
            lastHeard = msg.text;
            line("caller", "保護者", msg.text);
            return;
          }
          if (msg.type === "say") {
            const metric =
              msg.latencyMs == null ? "" : `${msg.latencyFromSpeechEndMs}ms(合成 ${msg.ttsMs}ms)`;
            line("agent", "AI", msg.text, metric);
            if (msg.latencyMs != null) addMetric(lastHeard, msg.latencyFromSpeechEndMs, msg.ttsMs);
            await playAudio(msg.audio);
            ws.send(JSON.stringify({ type: "playback-done" }));
            return;
          }
          if (msg.type === "interrupt") {
            // 話し始めたのでAIが黙る(被せ)
            stopPlayback();
            return;
          }
          if (msg.type === "state") {
            $("stateLabel").textContent = msg.state;
            return;
          }
          if (msg.type === "ended") {
            const s = msg.summary;
            line(
              "sys",
              "システム",
              `通話終了 / 要件=${s.intent} 仮予約=${s.slot || "なし"} 連絡先=${s.phone || "未取得"}`
            );
            stop();
          }
        };

        ws.onclose = () => line("sys", "システム", "接続が切れました。");
      }

      function stop() {
        $("start").disabled = false;
        $("hangup").disabled = true;
        $("stateLabel").textContent = "待機中";
        recorder?.state === "recording" && recorder.stop();
        micStream?.getTracks().forEach((t) => t.stop());
        audioCtx?.close();
        ws?.close();
        ws = null;
      }

      $("start").onclick = () => start().catch((e) => line("sys", "エラー", e.message));
      $("hangup").onclick = () => {
        ws?.send(JSON.stringify({ type: "hangup" }));
        setTimeout(stop, 500);
      };
    </script>
  </body>
</html>
